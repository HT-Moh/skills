<title>Claude Tune Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column of phase groups; each item is a row that opens inline; sticky footer builds the apply command. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --fg: #1a1f2b; --muted: #5b6676; --line: #d9dee7;
  --accent: #245fd2; --accent-fg: #ffffff; --safe: #1d7f4a; --review: #a86a12; --manual: #5f6b7d;
  --chip-bg: #eef1f6; --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141a; --surface: #191d25; --fg: #e5e8ef; --muted: #98a2b3; --line: #2a3140;
  --accent: #7ea4ff; --accent-fg: #0c1322; --safe: #4fc17f; --review: #e0a94a; --manual: #9aa5b8; --chip-bg: #232934; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11141a; --surface: #191d25; --fg: #e5e8ef; --muted: #98a2b3; --line: #2a3140;
  --accent: #7ea4ff; --accent-fg: #0c1322; --safe: #4fc17f; --review: #e0a94a; --manual: #9aa5b8; --chip-bg: #232934; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 120px; }
main { max-width: 920px; margin: 0 auto; display: grid; gap: 28px; }
h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 600; margin: 0; display: flex; gap: 10px; align-items: baseline; }
h2 small { color: var(--muted); font-weight: 400; }
p { margin: 0; max-width: 68ch; }
.lead { color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.phase { display: grid; gap: 10px; }
.phase-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.phase-head button { font: 500 12px var(--font); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.row { display: grid; grid-template-columns: 24px 60px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; cursor: pointer; }
.row input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.id { font: 500 13px var(--mono); color: var(--muted); }
.title { min-width: 0; font-weight: 500; }
.chips { display: flex; gap: 6px; }
.chip { font: 500 11px var(--font); letter-spacing: 0.03em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--muted); }
.chip.safe { color: var(--safe); } .chip.review { color: var(--review); } .chip.manual { color: var(--manual); }
.chip.applied, .chip.done { background: var(--safe); color: var(--surface); }
.detail { display: grid; gap: 10px; padding: 4px 14px 14px 50px; border-top: 1px solid var(--line); font-size: 14px; }
.detail dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; margin: 0; }
.detail dt { color: var(--muted); } .detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.detail a { color: var(--accent); }
.ops { display: grid; gap: 6px; }
.op { font: 12.5px/1.5 var(--mono); background: var(--chip-bg); border-radius: 6px; padding: 6px 10px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.item.open .row { border-bottom: 0; }
.item.disabled .row { opacity: 0.6; }
.hint { font-size: 13px; color: var(--muted); }
footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.bar { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: center; }
.cmd { font: 13px var(--mono); background: var(--chip-bg); border-radius: 6px; padding: 9px 12px; min-width: 0; overflow-x: auto; white-space: nowrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button.primary { font: 600 13px var(--font); background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; }
button.ghost { font: 500 13px var(--font); background: none; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-size: 13px; color: var(--muted); grid-column: 1 / -1; }
.count b { color: var(--fg); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .row { grid-template-columns: 24px 1fr; } .id { order: 3; } .chips { order: 4; grid-column: 2; } .detail { padding-left: 14px; } .bar { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .detail { animation: open .12s ease-out; } @keyframes open { from { opacity: 0 } } }
</style>

<main>
  <header>
    <h1>Claude Tune Plan</h1>
    <p class="lead" id="summary"></p>
    <div class="stats" id="stats"></div>
    <p class="hint" style="margin-top:10px">Tick the changes you want. The command at the bottom applies exactly those; every file is backed up first and each item can be rolled back on its own.</p>
  </header>
  <div id="phases"></div>
</main>
<footer>
  <div class="bar">
    <div class="cmd" id="cmd">/claude-tune-apply</div>
    <div class="actions">
      <button class="ghost" id="selSafe" type="button">Select all safe</button>
      <button class="ghost" id="clear" type="button">Clear</button>
      <button class="primary" id="copy" type="button">Copy command</button>
    </div>
    <div class="count" id="count"></div>
  </div>
</footer>

<script id="plan" type="application/json">{{PLAN_JSON}}</script>
<script>
(function () {
  var plan = JSON.parse(document.getElementById("plan").textContent);
  var PHASES = { 0: "Security", 1: "Global config", 2: "Instruction files", 3: "Skills, rules, scripts", 4: "Pipelines", 5: "Habits", 6: "Later" };
  var STORE = "claude-tune-selection-" + (plan.generated || "");
  var selected = {};
  try { selected = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { selected = {}; }
  var applied = function (it) { return it.status === "applied" || it.status === "done"; };

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function opLine(op) {
    if (op.kind === "manual") return "manual: " + (op.text || "");
    if (op.kind === "symlink") return "symlink " + op.link + " -> " + op.target;
    var p = op.path ? " " + op.path.join(".") : "";
    var v = op.value !== undefined ? " = " + JSON.stringify(op.value) : (op.values ? " += " + JSON.stringify(op.values) : "");
    return op.kind + " " + op.file + p + v;
  }
  function detail(it) {
    var d = el("div", "detail"); var dl = el("dl");
    [["Why", it.why], ["Evidence", it.evidence], ["Impact", it.impact], ["Rollback", it.rollback || "/claude-tune-apply --rollback " + it.id],
     ["Depends on", (it.depends_on || []).join(", ") || "nothing"], ["Verify", it.verify]].forEach(function (pair) {
      if (!pair[1]) return; dl.appendChild(el("dt", null, pair[0])); dl.appendChild(el("dd", null, pair[1])); });
    if (it.docs) { dl.appendChild(el("dt", null, "Docs")); var dd = el("dd"); var a = el("a", null, it.docs); a.href = it.docs; a.target = "_blank"; a.rel = "noopener"; dd.appendChild(a); dl.appendChild(dd); }
    d.appendChild(dl);
    var ops = el("div", "ops"); (it.ops || []).forEach(function (op) { ops.appendChild(el("div", "op", opLine(op))); }); d.appendChild(ops);
    return d;
  }
  function render() {
    var root = document.getElementById("phases"); root.textContent = "";
    var byPhase = {}; plan.items.forEach(function (it) { (byPhase[it.phase] = byPhase[it.phase] || []).push(it); });
    Object.keys(byPhase).sort().forEach(function (ph) {
      var sec = el("section", "phase"); var head = el("div", "phase-head");
      var h = el("h2", null, "Phase " + ph + " · " + (PHASES[ph] || "")); h.appendChild(el("small", null, byPhase[ph].length + " items")); head.appendChild(h);
      var b = el("button", null, "Select phase"); b.type = "button"; b.onclick = function () { byPhase[ph].forEach(function (it) { if (!applied(it)) selected[it.id] = true; }); render(); }; head.appendChild(b);
      sec.appendChild(head);
      byPhase[ph].forEach(function (it) {
        var item = el("article", "item" + (applied(it) ? " disabled" : "")); item.id = "item-" + it.id;
        var row = el("label", "row"); var cb = el("input"); cb.type = "checkbox"; cb.id = "cb-" + it.id; cb.checked = !!selected[it.id] && !applied(it); cb.disabled = applied(it);
        cb.onchange = function () { selected[it.id] = cb.checked; update(); };
        row.appendChild(cb); row.appendChild(el("span", "id", it.id)); row.appendChild(el("span", "title", it.title));
        var chips = el("span", "chips"); chips.appendChild(el("span", "chip " + it.risk, it.risk)); if (it.status && it.status !== "proposed") chips.appendChild(el("span", "chip " + it.status, it.status.replace("_", " "))); row.appendChild(chips);
        var toggle = el("button", "ghost", "Details"); toggle.type = "button"; toggle.style.cssText = "padding:4px 8px;font-size:12px";
        toggle.onclick = function (ev) { ev.preventDefault(); var open = item.classList.toggle("open"); if (open) item.appendChild(detail(it)); else item.removeChild(item.lastChild); toggle.textContent = open ? "Hide" : "Details"; };
        chips.appendChild(toggle);
        item.appendChild(row); sec.appendChild(item);
      });
      root.appendChild(sec);
    });
    update();
  }
  function update() {
    var ids = plan.items.filter(function (it) { return selected[it.id] && !applied(it); }).map(function (it) { return it.id; });
    document.getElementById("cmd").textContent = "/claude-tune-apply" + (ids.length ? " " + ids.join(" ") : "");
    var manual = plan.items.filter(function (it) { return ids.indexOf(it.id) >= 0 && it.risk === "manual"; }).length;
    document.getElementById("count").innerHTML = "<b>" + ids.length + "</b> selected" + (manual ? " · <b>" + manual + "</b> need your own action (printed, not executed)" : "");
    try { localStorage.setItem(STORE, JSON.stringify(selected)); } catch (e) {}
  }
  document.getElementById("selSafe").onclick = function () { plan.items.forEach(function (it) { if (it.risk === "safe" && !applied(it)) selected[it.id] = true; }); render(); };
  document.getElementById("clear").onclick = function () { selected = {}; render(); };
  document.getElementById("copy").onclick = function () {
    var text = document.getElementById("cmd").textContent; var btn = this;
    function done(ok) { btn.textContent = ok ? "Copied" : "Select and copy the text above"; setTimeout(function () { btn.textContent = "Copy command"; }, 1800); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { selectCmd(); done(false); });
    else { selectCmd(); done(false); }
  };
  function selectCmd() { var r = document.createRange(); r.selectNodeContents(document.getElementById("cmd")); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  document.getElementById("summary").textContent = plan.summary || "";
  var counts = { safe: 0, review: 0, manual: 0, applied: 0 };
  plan.items.forEach(function (it) { counts[it.risk] = (counts[it.risk] || 0) + 1; if (applied(it)) counts.applied++; });
  document.getElementById("stats").innerHTML = "<span><b>" + plan.items.length + "</b> changes</span><span><b>" + counts.safe + "</b> safe</span><span><b>" + counts.review + "</b> review</span><span><b>" + counts.manual + "</b> manual</span><span><b>" + counts.applied + "</b> applied</span><span>window <b>" + (plan.window_days || "?") + "</b> days</span><span>generated " + (plan.generated || "").slice(0, 16).replace("T", " ") + "</span>";
  render();
})();
</script>
